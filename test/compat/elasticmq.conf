# Copied unchanged from ssut/nestjs-sqs (MIT) .github/build/elasticmq.conf at 44ffd92.
# Creates the FIFO queue and dead-letter queue test/compat expects; other tests create their own queues.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Possible values: relaxed, strict
  sqs-limits = strict
}

akka.http.server.request-timeout = 30 seconds

queues {
    test {
        defaultVisibilityTimeout = 10 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
            name = "test-dead.fifo"
            maxReceiveCount = 1
        }
        fifo = true
        contentBasedDeduplication = false
        tags {
        }
    }
    test-dead {
      fifo = true
    }
}

aws {
  region = us-west-2
  accountId = 000000000000
}
